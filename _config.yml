# Site
title            : "Ravulapalli Manas Venkata Sai"
brand            : "Manas Ravulapalli"
description      : "Computational and theoretical neuroscience: how neural systems build structured internal models of the world, and the same question in artificial systems."
url              : "https://ravulapallimanas.github.io"
baseurl          : ""
repository       : "RavulapalliManas/RavulapalliManas.github.io"
lang             : "en"
timezone         : "Asia/Kolkata"

author:
  name           : "Ravulapalli Manas Venkata Sai"
  short_name     : "Manas Ravulapalli"
  email          : "rmanasofficial@gmail.com"
  location       : "Sonipat, Haryana, India"
  affiliation    : "Ashoka University"
  github         : "https://github.com/RavulapalliManas"
  linkedin       : "https://www.linkedin.com/in/manas-ravulapalli-386433220/"

navigation:
  - { key: about,       title: "About",       url: "/about/" }
  - { key: research,    title: "Research",    url: "/research/" }
  - { key: projects,    title: "Projects",    url: "/projects/" }
  - { key: teaching,    title: "Teaching",    url: "/teaching/" }
  - { key: writing,     title: "Writing",     url: "/writing/" }
  - { key: photography, title: "Photography", url: "/photography/" }
  - { key: cv,          title: "CV",          url: "/cv/" }

# Build
markdown         : kramdown
kramdown:
  input          : GFM
  auto_ids       : true
  smart_quotes   : lsquo,rsquo,ldquo,rdquo
permalink        : /writing/:year/:month/:title/
future           : false
excerpt_separator: "\n\n"

plugins:
  - jekyll-feed
  - jekyll-sitemap

feed:
  path: feed.xml

collections:
  publications:
    output       : true
    permalink    : /research/:name/
  portfolio:
    output       : true
    permalink    : /projects/:name/
  teaching:
    output       : true
    permalink    : /teaching/:name/

defaults:
  - scope:
      path       : ""
      type       : posts
    values:
      layout     : post
      nav        : writing
      read_time  : true
  - scope:
      path       : ""
      type       : publications
    values:
      layout     : entry
      nav        : research
      eyebrow    : "Paper or manuscript"
      back_url   : "/research/"
      back_title : "All research"
  - scope:
      path       : ""
      type       : portfolio
    values:
      layout     : entry
      nav        : projects
      eyebrow    : "Project"
      back_url   : "/projects/"
      back_title : "All projects"
  - scope:
      path       : ""
      type       : teaching
    values:
      layout     : entry
      nav        : teaching
      eyebrow    : "Teaching"
      back_url   : "/teaching/"
      back_title : "All teaching"

include:
  - files
exclude:
  - .bundle
  - .devcontainer
  - .github
  - CONTRIBUTING.md
  - Dockerfile
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - docker-compose.yaml
  - package.json
  - package-lock.json
  - scripts
  - vendor
