# Site
title            : "Ravulapalli Manas Venkata Sai"
brand            : "Manas Ravulapalli"
description      : "Manas Ravulapalli. I study how brains and neural networks learn maps of the world, and how language models gain and lose skills during training."
url              : "https://ravulapallimanas.github.io"
baseurl          : ""
repository       : "RavulapalliManas/RavulapalliManas.github.io"
lang             : "en"
timezone         : "Asia/Kolkata"

author:
  name           : "Ravulapalli Manas Venkata Sai"
  short_name     : "Manas Ravulapalli"
  email          : "rmanasofficial@gmail.com"
  location       : "Sonipat, Haryana, India"
  affiliation    : "Ashoka University"
  github         : "https://github.com/RavulapalliManas"
  linkedin       : "https://www.linkedin.com/in/manas-ravulapalli-386433220/"

navigation:
  - { key: research,    title: "Research",    url: "/research/" }
  - { key: writing,     title: "Writing",     url: "/writing/" }
  - { key: cv,          title: "CV",          url: "/cv/" }

# Build
markdown         : kramdown
kramdown:
  input          : GFM
  auto_ids       : true
  smart_quotes   : lsquo,rsquo,ldquo,rdquo
permalink        : /writing/:year/:month/:title/
future           : false
excerpt_separator: "\n\n"

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

feed:
  path: feed.xml

collections:
  publications:
    output       : true
    permalink    : /research/:name/
  portfolio:
    output       : true
    permalink    : /projects/:name/
  teaching:
    output       : true
    permalink    : /teaching/:name/

defaults:
  - scope:
      path       : ""
      type       : posts
    values:
      layout     : post
      nav        : writing
      read_time  : true
  - scope:
      path       : ""
      type       : publications
    values:
      layout     : entry
      nav        : research
      back_url   : "/research/"
      back_title : "Research"
  - scope:
      path       : ""
      type       : portfolio
    values:
      layout     : entry
      nav        : projects
      back_url   : "/research/#projects"
      back_title : "Research"
  - scope:
      path       : ""
      type       : teaching
    values:
      layout     : entry
      nav        : teaching
      back_url   : "/cv/#teaching"
      back_title : "CV"

include:
  - files
exclude:
  - .bundle
  - .devcontainer
  - .github
  - CONTRIBUTING.md
  - Dockerfile
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - docker-compose.yaml
  - package.json
  - package-lock.json
  - scripts
  - vendor
