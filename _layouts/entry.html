---
layout: base
---
<article class="section">
  <div class="shell">
    <h1>{{ page.title }}</h1>
    {%- if page.authors %}<p class="meta">{{ page.authors }}</p>{% endif %}
    {%- if page.status %}<p class="meta">{{ page.status }}</p>{% endif %}
    {%- if page.period %}<p class="meta">{{ page.role }}, {{ page.venue }}. {{ page.period }}.</p>{% endif %}
    <div class="prose">
      {{ content }}
    </div>
    <p class="back"><a href="{{ page.back_url | default: '/' | relative_url }}">&larr; {{ page.back_title | default: 'Home' }}</a></p>
  </div>
</article>
