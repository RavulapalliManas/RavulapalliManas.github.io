---
layout: base
---
<section class="section">
  <div class="shell hero">
    <div class="hero__text">
      <h1>{{ site.author.short_name }}</h1>
      {{ content }}
      <p class="links">
        <a href="mailto:{{ site.author.email }}">Email</a> &middot;
        <a href="{{ site.author.github }}">GitHub</a> &middot;
        <a href="{{ site.author.linkedin }}">LinkedIn</a> &middot;
        <a href="{{ '/cv/' | relative_url }}">CV</a>
      </p>
    </div>
    <img class="hero__photo" src="{{ page.hero_image | relative_url }}" alt="{{ page.hero_image_alt }}" width="200" height="200">
  </div>
</section>
