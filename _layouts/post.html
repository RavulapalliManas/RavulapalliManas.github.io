---
layout: base
---
<article class="section">
  <div class="shell">
    <p class="meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
      {%- if page.read_time %} &middot; {{ content | number_of_words | divided_by: 200 | plus: 1 }} min read{% endif %}
    </p>
    <h1>{{ page.title }}</h1>
    <div class="prose">
      {{ content }}
    </div>
    <p class="back"><a href="{{ '/writing/' | relative_url }}">&larr; All writing</a></p>
  </div>
</article>
