---
layout: base
---
<section class="section page-section">
  <div class="shell stack-lg">
    <header class="page-header{% if page.narrow %} page-header--narrow{% endif %}">
      {%- if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
      <h1>{{ page.title }}</h1>
      {%- if page.intro %}<p class="page-intro">{{ page.intro }}</p>{% endif %}
    </header>

    {%- if page.prose %}
    <div class="prose prose--page">
      {{ content }}
    </div>
    {%- else %}
    {{ content }}
    {%- endif %}
  </div>
</section>
