<header class="site-header">
  <nav class="site-nav" aria-label="Primary navigation">
    <div class="site-nav__inner shell">
      <a class="site-brand" href="{{ '/' | relative_url }}">{{ site.brand }}</a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav-panel" aria-label="Open navigation menu">
        <span aria-hidden="true">&#9776;</span>
      </button>
      <div class="site-nav__panel" id="site-nav-panel">
        {%- for item in site.navigation -%}
        {%- assign item_url = item.url | relative_url -%}
        <a class="site-nav__link{% if page.nav == item.key %} is-active{% endif %}" href="{{ item_url }}">{{ item.title }}</a>
        {%- endfor -%}
      </div>
    </div>
  </nav>
</header>
