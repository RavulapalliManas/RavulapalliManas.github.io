<header class="site-header">
  <nav class="site-nav" aria-label="Primary navigation">
    <div class="site-nav__inner">
      <a class="site-brand" href="{{ '/' | relative_url }}">{{ site.brand }}</a>
      <div class="site-nav__panel">
        {%- for item in site.navigation -%}
        <a class="site-nav__link{% if page.nav == item.key %} is-active{% endif %}" href="{{ item.url | relative_url }}">{{ item.title }}</a>
        {%- endfor -%}
      </div>
    </div>
  </nav>
</header>
