# Photography gallery.
#
# To add a photo:
#   1. Put the image file in images/photos/
#   2. Add an entry below.
#
# Every field is required. `alt` describes the image for screen readers and for
# anyone whose images fail to load. Write what is in the frame.
#
# - file: reef-at-dusk.jpg
#   caption: "Reef at dusk"
#   alt: "A shallow reef under low orange light, with two fish in the foreground."
#   tags: [Underwater, Wildlife]


- file: lake-blossom.jpg
  caption: "Blossom over the lake, March 2026"
  alt: "Branches with small pink blossoms in front of a calm lake, with wooded hills and a building on the far shore."
  tags: [Lake, Blossom, Spring]

- file: lake-haze.jpg
  caption: "Afternoon haze, March 2026"
  alt: "A lake under hazy afternoon light, with layered blue hills behind it and a few small boats on the water."
  tags: [Lake, Mountains]

- file: lake-shore.jpg
  caption: "The far shore, March 2026"
  alt: "Green lake water in the foreground and a wooded shoreline with hills under a clear sky."
  tags: [Lake, Hills]

- file: blue-water.jpg
  caption: "Bhimtal, March 2026"
  alt: "Looking down into clear blue water, where a submerged branch runs across the frame and a bird sits on its tip."
  tags: [Lake, Bird, Bhimtal]
